<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cutting your scenes</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible{outline:3px solid #7C9BFF;outline-offset:3px}
@keyframes rf-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5F7; color: #0F1222; font-family: 'Inter', system-ui, sans-serif">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 16px 24px; border-bottom: 1px solid rgba(15, 18, 34, .1)">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#2B5BFF" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M14 4 3 9.5 14 15l11-5.5L14 4Z" fill="#2B5BFF"/><path d="m3 14.5 11 5.5 11-5.5"/><path d="m3 19.5 11 5.5 11-5.5"/></svg>
      <span style="font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em">repofeed<span style="color: #555A6E">.ai</span></span>
    </div>
    <ol aria-label="Progress" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
      <li style="padding: 6px 12px; border-radius: 999px; background: #E4E6EE; color: #0F1222">1 Upload</li>
      <li aria-current="step" style="padding: 6px 12px; border-radius: 999px; background: #0F1222; color: #FFFFFF">2 Scenes</li>
      <li style="padding: 6px 12px; border-radius: 999px; background: #E4E6EE; color: #555A6E">3 Publish</li>
    </ol>
  </header>

  <main style="flex: 1 1 auto; display: grid; align-items: center; padding: 32px clamp(24px, 6vw, 96px) 48px">
    <section style="width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 64px">
      <div style="flex: 1 1 400px; max-width: 520px; display: flex; flex-direction: column; gap: 20px">
        <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #2B5BFF">In the edit room</div>
        <h1 aria-live="polite" style="margin: 0; font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 800; font-size: clamp(40px, 5.2vw, 68px); line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance">{{headline}}</h1>
        <p style="margin: 0; max-width: 44ch; font-size: 19px; line-height: 1.5; color: #555A6E">We’re reading every file so your team doesn’t have to. You can leave this tab. Nothing goes on air until you’ve reviewed it.</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 8px">
          <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
            <a href="Scenes.dc.html" style="display: inline-flex; align-items: center; height: 56px; padding: 0 24px; border-radius: 14px; background: #2B5BFF; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">Review the scenes</a>
          </sc-if>
        </div>
      </div>

      <div style="flex: 1 1 440px; min-width: 0; min-height: 440px; display: flex; align-items: center; justify-content: center">
        <div style="width: 440px; max-width: 100%; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; gap: 24px; border-radius: 24px; background: #0F1222; color: #F4F5F7; box-shadow: 0 30px 60px rgba(15, 18, 34, .25)">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #A4A9BD">Sample study</span>
            <span style="padding: 6px 12px; border-radius: 999px; background: {{pillBg}}; color: {{pillFg}}; font-size: 13px; font-weight: 600">{{pill}}</span>
          </div>
          <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden">
            <div style="width: {{pct}}; height: 100%; border-radius: 4px; background: #FFD84A; transition: width .8s ease"></div>
          </div>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px">
            <sc-for list="{{ steps }}" as="t" hint-placeholder-count="4">
              <li style="display: flex; align-items: center; gap: 14px; color: {{t.fg}}; transition: color .4s ease">
                <span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 50%; background: {{t.dot}}; animation: {{t.anim}}"></span>
                <span style="flex: 1 1 auto; font-size: 18px; font-weight: 600">{{t.label}}</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px">{{t.state}}</span>
              </li>
            </sc-for>
          </ol>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._i = setInterval(() => {
      const st = (this.state || {}).step || 0;
      if (st >= 4) { clearInterval(this._i); return; }
      this.setState({ step: st + 1 });
    }, 1300);
  }
  componentWillUnmount() {
    clearInterval(this._i);
  }
  renderVals() {
    const step = (this.state || {}).step || 0;
    const done = step >= 4;
    const labels = ['Reading your files', 'Finding the moments that matter', 'Writing short insight scenes', 'Lining up the feed'];
    const steps = labels.map((label, i) => {
      const isDone = i < step;
      const active = i === step;
      return {
        label: label,
        fg: isDone || active ? '#F4F5F7' : '#A4A9BD',
        dot: isDone ? '#FFD84A' : (active ? '#8FA8FF' : 'rgba(255,255,255,.2)'),
        anim: active ? 'rf-pulse 1s ease infinite' : 'none',
        state: isDone ? 'Done' : (active ? 'Working' : 'Queued')
      };
    });
    return {
      steps: steps,
      done: done,
      headline: done ? 'That’s a cut.' : 'Cutting your scenes.',
      pct: (step * 25) + '%',
      pill: done ? 'Ready for review' : 'Cutting',
      pillBg: done ? '#FFD84A' : 'rgba(255,255,255,.14)',
      pillFg: done ? '#0F1222' : '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
