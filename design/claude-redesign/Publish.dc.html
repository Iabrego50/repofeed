<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review and publish: division feed</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #7C9BFF;outline-offset:3px}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5F7; color: #0F1222; font-family: 'Inter', system-ui, sans-serif">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 16px 24px; border-bottom: 1px solid rgba(15, 18, 34, .1)">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#2B5BFF" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M14 4 3 9.5 14 15l11-5.5L14 4Z" fill="#2B5BFF"/><path d="m3 14.5 11 5.5 11-5.5"/><path d="m3 19.5 11 5.5 11-5.5"/></svg>
      <span style="font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em">repofeed<span style="color: #555A6E">.ai</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 15px">
      <span style="font-weight: 600">Acme Research</span>
      <span style="padding: 4px 10px; border-radius: 999px; background: #E4E6EE; font-size: 13px; font-weight: 600">Owner</span>
    </div>
  </header>

  <main style="flex: 1 1 auto; padding: clamp(32px, 6vw, 72px) clamp(24px, 6vw, 96px)">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #2B5BFF">Review &amp; publish</div>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 800; font-size: clamp(36px, 4.4vw, 56px); line-height: 1.04; letter-spacing: -0.02em; text-wrap: balance">Which channel gets this study?</h1>
        <p style="margin: 0; max-width: 52ch; font-size: 18px; line-height: 1.5; color: #555A6E">Assign it to a phone division feed. You can do this before or after publishing.</p>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 24px">
        <section aria-labelledby="pd-title" style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 20px; border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(15, 18, 34, .1)">
          <h2 id="pd-title" style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #555A6E">Phone division feed</h2>
          <div role="group" aria-labelledby="pd-title" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px">
            <sc-for list="{{ channels }}" as="c" hint-placeholder-count="5">
              <button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="min-height: 88px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; border: 1.5px solid {{c.bd}}; border-radius: 16px; background: {{c.bg}}; color: {{c.fg}}; cursor: pointer; transition: background .2s ease">
                <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: .08em; color: {{c.sub}}">{{c.num}}</span>
                <span style="font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.01em">{{c.label}}</span>
              </button>
            </sc-for>
          </div>
          <button type="button" onClick="{{ pickNone }}" aria-pressed="{{ noneOn }}" style="min-height: 52px; box-sizing: border-box; padding: 12px 16px; text-align: left; border: 1.5px dashed {{noneBd}}; border-radius: 16px; background: {{noneBg}}; color: {{noneFg}}; font-weight: 600; font-size: 16px; cursor: pointer">None. Keep this study off phone division feeds</button>
        </section>

        <section aria-labelledby="pv-title" aria-live="polite" style="flex: 1 1 300px; min-width: 0; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; border-radius: 24px; background: #0F1222; color: #F4F5F7">
          <div style="display: flex; flex-direction: column; gap: 16px">
            <h2 id="pv-title" style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #A4A9BD">Where it lands</h2>
            <div style="font-family: 'Bricolage Grotesque', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; color: {{landColor}}">{{landTitle}}</div>
            <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #C9CDE0">{{landBody}}</p>
          </div>
          <span style="align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: {{pillBg}}; color: {{pillFg}}; font-size: 13px; font-weight: 600">{{pill}}</span>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const sel = s.sel ?? 'Auto';
    const INK = '#0F1222';
    const names = ['Auto', 'GI', 'Wood', 'Marine', 'Website'];
    const channels = names.map((label, i) => {
      const on = sel === label;
      return {
        label: label,
        num: 'CH 0' + (i + 1),
        on: on,
        bg: on ? INK : '#FFFFFF',
        fg: on ? '#FFFFFF' : INK,
        sub: on ? '#FFD84A' : '#555A6E',
        bd: on ? INK : 'rgba(15,18,34,.3)',
        pick: () => this.setState({ sel: label })
      };
    });
    const none = sel === '';
    return {
      channels: channels,
      pickNone: () => this.setState({ sel: '' }),
      noneOn: none,
      noneBg: none ? INK : 'transparent',
      noneFg: none ? '#FFFFFF' : INK,
      noneBd: none ? INK : 'rgba(15,18,34,.4)',
      landTitle: none ? 'Off phone feeds' : sel + ' channel',
      landColor: none ? '#C9CDE0' : '#FFD84A',
      landBody: none
        ? 'Scenes from this study won’t appear in any phone division feed.'
        : 'Scenes from this study appear in the ' + sel + ' channel on the iOS app.',
      pill: none ? 'Not assigned' : 'iOS app',
      pillBg: none ? 'rgba(255,255,255,.14)' : '#2B5BFF',
      pillFg: '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
