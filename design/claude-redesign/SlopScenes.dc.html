<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review your scenes, Slopstrap version</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
<link rel="stylesheet" href="./assets/11b9b58aba84609684279bf975f7125a.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030712}
button{font:inherit}
.slop-scope a:focus-visible,.slop-scope button:focus-visible,.slop-scope label:focus-within,.slop-scope .slop-ai-bar:focus-within{outline:3px solid #c084fc;outline-offset:3px}
@keyframes rf-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rf-pop{from{opacity:0;transform:scale(.4)}}
@keyframes rf-on{0%{opacity:.15}30%{opacity:1}45%{opacity:.55}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.slop-scope *,.slop-scope *::before,.slop-scope *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="slop-scope slop-grid-bg" data-slop-level="3" style="min-height: 100vh; display: flex; flex-direction: column; overflow: hidden">
  <div class="slop-orb-layer" aria-hidden="true" style="position: absolute">
    <div class="slop-orb slop-orb-purple"></div>
    <div class="slop-orb slop-orb-cyan"></div>
    <div class="slop-orb slop-orb-pink"></div>
    <div class="slop-orb slop-orb-emerald"></div>
  </div>
  <div class="slop-content-layer" style="flex: 1 1 auto; display: flex; flex-direction: column">
  <header class="slop-navbar" style="position: relative; z-index: 2">
    <div class="slop-navbar-inner" style="flex-wrap: wrap; padding: 8px 24px">
      <span class="slop-brand"><span class="slop-brand-mark" aria-hidden="true">✨</span><span>repofeed<span style="color: #94a3b8">.ai</span></span></span>
      <div class="slop-row"><span class="slop-status"><span class="slop-dot slop-dot-green"></span>Signed in</span><ol class="slop-tabs" aria-label="Progress" style="margin: 0; list-style: none"><li class="slop-tab" style="cursor: default">1 Upload</li><li class="slop-tab is-active" aria-current="step" style="cursor: default; color: #ffffff">2 Scenes</li><li class="slop-tab" style="cursor: default">3 Publish</li></ol></div>
    </div>
  </header>
  <main style="position: relative; z-index: 1; flex: 1 1 auto; padding: clamp(32px, 5vw, 64px) clamp(24px, 6vw, 96px) 48px">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
        <div style="flex: 1 1 400px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
          <div class="slop-pill slop-pill-shimmer" style="margin-bottom: 0"><span class="slop-dot slop-dot-purple"></span><span class="slop-sparkle">Sample study · First cut</span></div>
          <h1 class="slop-h1" style="margin: 0; font-size: clamp(36px, 4.4vw, 56px); text-wrap: balance">You’re <span class="slop-underline slop-underline-emerald">the</span> <span class="slop-serif-emphasis slop-text-gradient-hot">editor</span>.</h1>
          <p class="slop-lead" style="margin: 0; max-width: 52ch">Keep the scenes worth your team’s scroll — cut the rest. Nothing airs without your say.</p>
        </div>
        <div class="slop-row">
          <span class="slop-status" aria-live="polite"><span class="slop-dot slop-dot-green"></span>{{keptLine}}</span>
          <a class="slop-btn slop-btn-primary slop-btn-lg" href="SlopPublish.dc.html">Pick a channel</a>
        </div>
      </div>
      <div class="slop-bento">
        <sc-for list="{{ scenes }}" as="c" hint-placeholder-count="4">
          <article class="{{c.cls}}" style="min-height: 320px; padding: 24px 22px 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; opacity: {{c.fade}}">
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
              <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8">{{c.num}}</span>
              <blockquote style="margin: 0; font-weight: 700; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; text-decoration: {{c.strike}}">{{c.quote}}</blockquote>
              <span style="font-size: 14px; color: #94a3b8">{{c.who}}</span>
              <span class="slop-badge slop-badge-ai">{{c.source}}</span>
            </div>
            <button type="button" class="{{c.btnCls}}" onClick="{{ c.toggle }}" aria-pressed="{{ c.kept }}" aria-label="{{c.aria}}" style="align-self: flex-start; min-height: 44px">{{c.btn}}</button>
          </article>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cut = (this.state || {}).cut || {};
    const borders = ['purple', 'cyan', 'pink', 'emerald'];
    const data = [
      { quote: '“It stopped feeling like help and started feeling like homework.”', who: 'Parent of two · 7 months', source: 'interviews.docx' },
      { quote: '[DEMO SCENE: a second quote from the interviews]', who: '[PARTICIPANT]', source: 'interviews.docx' },
      { quote: '[DEMO SCENE: a finding from the survey]', who: '[SEGMENT]', source: 'survey-q3.xlsx' },
      { quote: '[DEMO SCENE: a moment from the usability test]', who: '[PARTICIPANT]', source: 'usability.pdf' }
    ];
    const scenes = data.map((d, i) => {
      const kept = !cut[i];
      return {
        num: 'Scene ' + (i + 1),
        quote: d.quote,
        who: d.who,
        source: 'Cut from ' + d.source,
        kept: kept,
        cls: 'slop-card slop-border-l-' + borders[i % 4] + ' slop-bento-' + [7, 5, 5, 7][i % 4],
        fade: kept ? '1' : '.72',
        strike: kept ? 'none' : 'line-through',
        btn: kept ? 'Keeping. Tap to cut' : 'Cut. Tap to restore',
        btnCls: kept ? 'slop-btn slop-btn-primary' : 'slop-btn slop-btn-ghost',
        aria: 'Keep scene ' + (i + 1),
        toggle: () => this.setState({ cut: Object.assign({}, cut, { [i]: kept }) })
      };
    });
    const n = scenes.filter((c) => c.kept).length;
    return {
      scenes: scenes,
      keptLine: n + ' of ' + scenes.length + ' scenes kept'
    };
  }
}
</script>
</body>
</html>
