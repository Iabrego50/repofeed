<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B14" />
    <title>Offline | repofeed.ai</title>
    <style>
      /* Uses the brand fonts when the browser already has them, with close system fallbacks offline. */
      body {
        font-family: "Instrument Sans Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(60rem 30rem at 80% -10%, rgba(47, 155, 255, 0.12), transparent 60%), #070b14;
        color: #eef3fb;
        -webkit-font-smoothing: antialiased;
      }
      .container { text-align: center; padding: 2rem; max-width: 26rem; }
      .logo { display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2.5rem; }
      .logo img { height: 2rem; width: auto; }
      .wordmark {
        font-family: "Bricolage Grotesque Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em;
      }
      .wordmark span { color: #2f9bff; }
      .eyebrow {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
        color: #2f9bff; margin: 0 0 0.75rem;
      }
      h1 {
        font-family: "Bricolage Grotesque Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 2.25rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 0.75rem;
      }
      p { color: #93a0b8; line-height: 1.5; margin: 0; }
      button {
        margin-top: 1.75rem; min-height: 44px; padding: 0 1.5rem; border: 0;
        border-radius: 0.75rem; background: #2f9bff; color: #04101f;
        font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="/logo-mark.png" alt="" width="46" height="32" />
        <span class="wordmark">repo<span>feed</span>.ai</span>
      </div>
      <p class="eyebrow">No connection</p>
      <h1>The feed is paused.</h1>
      <p>repofeed.ai needs a connection to load your scenes. Check your internet and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
