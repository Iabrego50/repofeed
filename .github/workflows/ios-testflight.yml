name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

env:
  # Client env baked into the Vite build (also list these as repository secrets).
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
  VITE_ENABLE_GOOGLE_AUTH: ${{ secrets.VITE_ENABLE_GOOGLE_AUTH }}
  VITE_ENABLE_APPLE_AUTH: ${{ secrets.VITE_ENABLE_APPLE_AUTH }}

jobs:
  testflight:
    name: Build and upload to TestFlight
    # App Store requires iOS 26 SDK (Xcode 26+). macos-26 ships Xcode 26 by default.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          ls /Applications/Xcode*.app 2>/dev/null || true
          # Prefer the newest Xcode_26*.app; fall back to default Xcode.app if it is 26+.
          CANDIDATE="$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "${CANDIDATE}" ] && [ -d /Applications/Xcode.app ]; then
            CANDIDATE="/Applications/Xcode.app"
          fi
          if [ -z "${CANDIDATE}" ] || [ ! -d "${CANDIDATE}" ]; then
            echo "::error::No Xcode 26+ found under /Applications (need iOS 26 SDK for App Store)." >&2
            exit 1
          fi
          sudo xcode-select -s "${CANDIDATE}"
          echo "Selected Xcode: $(xcode-select -p)"
          xcodebuild -version
          # Fail clearly if the selected toolchain is still < 26.
          MAJOR="$(xcodebuild -version | awk '/Xcode/ {print $2}' | cut -d. -f1)"
          if [ "${MAJOR}" -lt 26 ]; then
            echo "::error::Selected Xcode ${MAJOR} is too old; App Store requires Xcode 26+ / iOS 26 SDK." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift packages
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          if printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          ls -la "$KEY_PATH"

      - name: Setup Ruby / Bundler for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Archive and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for key in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_API_KEY_PATH \
            IOS_DIST_CERT_P12_BASE64 \
            IOS_DIST_CERT_PASSWORD \
            IOS_APPSTORE_PROFILE_BASE64 \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY
          do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret/env: $key" >&2
              exit 1
            fi
          done
          fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repofeed-ipa
          path: build/repofeed.ipa
          if-no-files-found: ignore
          retention-days: 14
