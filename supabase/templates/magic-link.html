<!doctype html>
<html>
  <body style="margin:0;background:#070b14;color:#eef3fb;font-family:Instrument Sans,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#070b14;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background:#0e1422;border:1px solid #1f2a40;border-radius:16px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;color:#2f9bff;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;">repofeed.ai</p>
                <h1 style="margin:0 0 16px;font-size:28px;">Your sign-in link</h1>
                <p style="margin:0 0 24px;color:#93a0b8;line-height:1.5;">Open this link to sign in. It works on any device, including one that did not request the email.</p>
                <p>
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=magiclink"
                     style="display:inline-block;background:#2f9bff;color:#04101f;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:999px;">
                    Sign in to repofeed.ai
                  </a>
                </p>
                <p style="margin:24px 0 0;color:#93a0b8;font-size:13px;line-height:1.5;">If you did not ask for this link, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
